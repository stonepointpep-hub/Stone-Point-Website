name: Sync testing records

on:
  schedule:
    - cron: "17 10 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      RESULTS_SOURCE_URL: ${{ secrets.RESULTS_SOURCE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install parser
        run: python -m pip install beautifulsoup4==4.12.3
      - name: Refresh customer-safe records
        run: python scripts/sync_testing_records.py
      - name: Publish changes when records changed
        run: |
          if git diff --quiet -- coa-library.js; then
            echo "No testing-record changes found."
            exit 0
          fi
          git config user.name "stone-point-records-bot"
          git config user.email "actions@users.noreply.github.com"
          git add coa-library.js
          git commit -m "Update customer testing summaries"
          git push
